    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
                        accent: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' }
                    }
                }
            }

    <style>
        /* ===== ESTILOS GLOBAIS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            min-height: 100vh;
            transition: width 0.3s ease;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 50;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar.collapsed .nav-text {
            display: none;
        }

        .sidebar.collapsed .logo-text {
            display: none;
        }

        .sidebar.collapsed .nav-category {
            display: none;
        }

        .sidebar.collapsed .nav-item {
            justify-content: center;
            padding: 0.75rem;
        }

        .sidebar.collapsed .nav-item i {
            margin-right: 0;
        }

        .main-content {
            margin-left: 260px;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
        }

        .main-content.expanded {
            margin-left: 70px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.65rem 1.25rem;
            margin: 2px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .nav-item.active {
            background: #3b82f6;
            color: #fff;
            font-weight: 600;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            margin-right: 12px;
            font-size: 1rem;
        }

        .nav-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            padding: 1rem 1.25rem 0.4rem;
            font-weight: 700;
        }

        /* ===== CARDS ===== */
        .stat-card {
            border-radius: 12px;
            padding: 1.25rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* ===== TABELAS ===== */
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .data-table th {
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
        }

        .data-table td {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
        }

        .data-table tbody tr {
            transition: background-color 0.15s;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 2rem;
            overflow-y: auto;
        }

        .modal-content {
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
            margin-bottom: 2rem;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== BADGES ===== */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-maintenance {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-reserve {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-retired {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-overdue {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-ok {
            background: #dcfce7;
            color: #166534;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            color: #fff;
            font-size: 0.875rem;
            font-weight: 500;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 280px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .toast-success {
            background: #16a34a;
        }

        .toast-error {
            background: #dc2626;
        }

        .toast-warning {
            background: #d97706;
        }

        .toast-info {
            background: #2563eb;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        /* ===== FORMULÁRIO ===== */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem 0.85rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .dark .form-input {
            background: #1e293b;
            border-color: #334155;
            color: #e2e8f0;
        }

        .dark .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* ===== TABS ===== */
        .tab-btn {
            padding: 0.6rem 1.25rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            border-bottom-color: #3b82f6;
            color: #3b82f6;
        }

        /* ===== CHECKLIST ===== */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0;
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        /* ===== CALENDAR ===== */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-day {
            min-height: 80px;
            padding: 0.35rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.8rem;
        }

        .calendar-day:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .calendar-day.today {
            border: 2px solid #3b82f6;
        }

        .calendar-day.has-events {
            background: rgba(59, 130, 246, 0.05);
        }

        .calendar-event {
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px !important;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0 !important;
            }

            .modal-content {
                width: 95%;
                max-width: none;
            }

            .calendar-day {
                min-height: 50px;
            }
        }

        /* ===== LOADING ===== */
        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ===== NOTIFICATION BELL ===== */
        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: #fff;
            font-size: 0.65rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* Print styles */
        @media print {

            .sidebar,
            .no-print {
                display: none !important;
            }

            .main-content {
                margin-left: 0 !important;
            }
        }
    </style>
</head>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ============================================================
        // DATABASE MODULE - IndexedDB
        // ============================================================
        const DB = {
            name: 'PrevenTechDB',
            version: 3,
            db: null,

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.name, this.version);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;

                        // Setores
                        if (!db.objectStoreNames.contains('sectors')) {
                            const store = db.createObjectStore('sectors', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('name', 'name', { unique: false });
                        }

                        // Equipamentos
                        if (!db.objectStoreNames.contains('equipments')) {
                            const store = db.createObjectStore('equipments', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('patrimony', 'patrimony', { unique: true });
                            store.createIndex('type', 'type', { unique: false });
                            store.createIndex('sectorId', 'sectorId', { unique: false });
                            store.createIndex('situation', 'situation', { unique: false });
                            store.createIndex('computerName', 'computerName', { unique: false });
                            store.createIndex('serialNumber', 'serialNumber', { unique: false });
                        }

                        // Preventivas
                        if (!db.objectStoreNames.contains('preventives')) {
                            const store = db.createObjectStore('preventives', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('equipmentId', 'equipmentId', { unique: false });
                            store.createIndex('date', 'date', { unique: false });
                            store.createIndex('technicianId', 'technicianId', { unique: false });
                            store.createIndex('nextDate', 'nextDate', { unique: false });
                        }

                        // Técnicos
                        if (!db.objectStoreNames.contains('technicians')) {
                            const store = db.createObjectStore('technicians', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('name', 'name', { unique: false });
                        }

                        // Logs
                        if (!db.objectStoreNames.contains('logs')) {
                            const store = db.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('timestamp', 'timestamp', { unique: false });
                            store.createIndex('type', 'type', { unique: false });
                        }

                        // Configurações
                        if (!db.objectStoreNames.contains('settings')) {
                            db.createObjectStore('settings', { keyPath: 'key' });
                        }

                        // Favoritos
                        if (!db.objectStoreNames.contains('favorites')) {
                            const store = db.createObjectStore('favorites', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('equipmentId', 'equipmentId', { unique: true });
                        }
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(this.db);
                    };

                    request.onerror = (e) => reject(e.target.error);
                });
            },

            // CRUD genérico
            async add(storeName, data) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    data.createdAt = new Date().toISOString();
                    data.updatedAt = new Date().toISOString();
                    const request = store.add(data);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },

            async update(storeName, data) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    data.updatedAt = new Date().toISOString();
                    const request = store.put(data);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },

            async delete(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            },

            async get(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },

            async getAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            },

            async getByIndex(storeName, indexName, value) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const index = store.index(indexName);
                    const request = index.getAll(value);
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            },

            // Backup & Restore
            async exportAll() {
                const data = {};
                const storeNames = ['sectors', 'equipments', 'preventives', 'technicians', 'logs', 'settings', 'favorites'];
                for (const name of storeNames) {
                    data[name] = await this.getAll(name);
                }
                return data;
            },

            async importAll(data) {
                for (const [storeName, records] of Object.entries(data)) {
                    if (this.db.objectStoreNames.contains(storeName)) {
                        const tx = this.db.transaction(storeName, 'readwrite');
                        const store = tx.objectStore(storeName);
                        store.clear();
                        for (const record of records) {
                            store.add(record);
                        }
                        await new Promise((resolve, reject) => {
                            tx.oncomplete = resolve;
                            tx.onerror = reject;
                        });
                    }
                }
            }
        };

        // ============================================================
        // LOG MODULE
        // ============================================================
        const Logger = {
            async log(type, action, details) {
                try {
                    await DB.add('logs', {
                        type,
                        action,
                        details,
                        timestamp: new Date().toISOString()
                    });
                } catch (e) { console.error('Log error:', e); }
            }
        };

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('pt-BR');
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function daysBetween(date1, date2) {
            const d1 = new Date(date1);
            const d2 = new Date(date2);
            return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
        }

        function addMonths(dateStr, months) {
            const d = new Date(dateStr);
            d.setMonth(d.getMonth() + months);
            return d.toISOString().split('T')[0];
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const icons = { success: 'check-circle', error: 'exclamation-circle', warning: 'exclamation-triangle', info: 'info-circle' };
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<i class="fas fa-${icons[type]}"></i>${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }

        let currentPage = 'dashboard';

        function navigateTo(page) {
            currentPage = page;

                item.classList.toggle('active', item.dataset.page === page);
            });

                dashboard: 'Dashboard', agenda: 'Agenda', alerts: 'Alertas',

                reports: 'Relatórios', backup: 'Backup & Restauração',
                settings: 'Configurações', logs: 'Logs do Sistema'

            document.getElementById('pageTitle').textContent = titles[page] || page;

            renderPage(page);

            document.getElementById('sidebar').classList.remove('mobile-open');

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('mainContent');

            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('mobile-open');
            } else {
                sidebarCollapsed = !sidebarCollapsed;
                sidebar.classList.toggle('collapsed');
                main.classList.toggle('expanded');

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            icon.className = isDark ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-gray-600';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fas fa-sun text-yellow-400';
            }

            if (e.key === 'Enter') {

        function renderDashboardCharts(equipments, sectors, preventives) {
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#64748b';
            const gridColor = isDark ? '#334155' : '#e2e8f0';

            // Chart: Equipments by Sector
            const sectorCounts = {};
            sectors.forEach(s => sectorCounts[s.name] = 0);
            equipments.forEach(e => {
                const sector = sectors.find(s => s.id === e.sectorId);
                if (sector) sectorCounts[sector.name] = (sectorCounts[sector.name] || 0) + 1;
            });

            const ctx1 = document.getElementById('chartSector');
            if (ctx1) {
                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(sectorCounts),
                        datasets: [{
                            data: Object.values(sectorCounts),
                            backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#f97316'],
                            borderRadius: 6,
                            maxBarThickness: 40
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor } },
                            x: { ticks: { color: textColor, maxRotation: 45 }, grid: { display: false } }
                        }
                    }
                });
            }

            // Chart: Notebook vs Desktop
            const ctx2 = document.getElementById('chartType');
            if (ctx2) {
                new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Notebook', 'Desktop'],
                        datasets: [{
                            data: [
                                equipments.filter(e => e.type === 'Notebook').length,
                                equipments.filter(e => e.type === 'Desktop').length
                            ],
                            backgroundColor: ['#8b5cf6', '#3b82f6'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom', labels: { color: textColor } } }
                    }
                });
            }

            // Chart: Preventive Status
            const today = new Date().toISOString().split('T')[0];
            let okCount = 0, warningCount = 0, overdueCount = 0, noPrevCount = 0;

            equipments.forEach(eq => {
                if (eq.situation === 'Baixado') return;
                const eqPrevs = preventives.filter(p => p.equipmentId === eq.id);
                if (eqPrevs.length === 0) { noPrevCount++; return; }
                const last = eqPrevs.sort((a, b) => b.date.localeCompare(a.date))[0];
                if (!last.nextDate) { noPrevCount++; return; }
                if (last.nextDate < today) overdueCount++;
                else if (daysBetween(today, last.nextDate) <= 30) warningCount++;
                else okCount++;
            });

            const ctx3 = document.getElementById('chartStatus');
            if (ctx3) {
                new Chart(ctx3, {
                    type: 'doughnut',
                    data: {
                        labels: ['Em dia', 'Atenção (30d)', 'Vencida', 'Sem preventiva'],
                        datasets: [{
                            data: [okCount, warningCount, overdueCount, noPrevCount],
                            backgroundColor: ['#22c55e', '#f59e0b', '#ef4444', '#94a3b8'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom', labels: { color: textColor, font: { size: 11 } } } }
                    }
                });
            }
        }

        async function saveSector(id) {
            const name = document.getElementById('sectorName').value.trim();
            if (!name) { showToast('Nome do setor é obrigatório', 'error'); return; }

            const data = {
                name,
                responsible: document.getElementById('sectorResponsible').value.trim(),
                extension: document.getElementById('sectorExtension').value.trim(),
                location: document.getElementById('sectorLocation').value.trim(),
                notes: document.getElementById('sectorNotes').value.trim()
            };

            try {
                if (id) {
                    data.id = id;
                    const existing = await DB.get('sectors', id);
                    data.createdAt = existing.createdAt;
                    await DB.update('sectors', data);
                    await Logger.log('sector', 'update', `Setor "${name}" atualizado`);
                    showToast('Setor atualizado com sucesso!');
                } else {
                    await DB.add('sectors', data);
                    await Logger.log('sector', 'create', `Setor "${name}" cadastrado`);
                    showToast('Setor cadastrado com sucesso!');
                }
                closeModal();
                renderSectors(document.getElementById('pageContainer'));
            } catch (e) {
                showToast('Erro ao salvar setor: ' + e.message, 'error');
            }
        }

        async function deleteSector(id) {
            if (!confirm('Deseja realmente excluir este setor?')) return;
            const sector = await DB.get('sectors', id);
            const equipments = await DB.getByIndex('equipments', 'sectorId', id);
            if (equipments.length > 0) {
                showToast('Não é possível excluir: existem equipamentos vinculados a este setor', 'error');
                return;
            }
            await DB.delete('sectors', id);
            await Logger.log('sector', 'delete', `Setor "${sector.name}" excluído`);
            showToast('Setor excluído com sucesso!');
            renderSectors(document.getElementById('pageContainer'));
        }

        function filterEquipments() {
            const term = document.getElementById('eqSearchInput')?.value.toLowerCase() || '';
            const type = document.getElementById('eqFilterType')?.value || '';
            const sector = document.getElementById('eqFilterSector')?.value || '';
            const situation = document.getElementById('eqFilterSituation')?.value || '';

            document.querySelectorAll('.equipment-row').forEach(row => {
                const text = row.textContent.toLowerCase();
                const matchText = text.includes(term);
                const matchType = !type || row.dataset.type === type;
                const matchSector = !sector || row.dataset.sector === sector;
                const matchSituation = !situation || row.dataset.situation === situation;
                row.style.display = matchText && matchType && matchSector && matchSituation ? '' : 'none';
            });
        }

        async function saveEquipment(id) {
            const patrimony = document.getElementById('eqPatrimony').value.trim();
            const type = document.getElementById('eqType').value;
            const sectorId = parseInt(document.getElementById('eqSector').value);

            if (!patrimony) { showToast('Patrimônio é obrigatório', 'error'); return; }
            if (!sectorId) { showToast('Setor é obrigatório', 'error'); return; }

            const data = {
                patrimony, type,
                situation: document.getElementById('eqSituation').value,
                manufacturer: document.getElementById('eqManufacturer').value.trim(),
                model: document.getElementById('eqModel').value.trim(),
                serialNumber: document.getElementById('eqSerialNumber').value.trim(),
                sectorId,
                responsibleUser: document.getElementById('eqResponsibleUser').value.trim(),
                acquisitionDate: document.getElementById('eqAcquisitionDate').value,
                warranty: document.getElementById('eqWarranty').value,
                label: document.getElementById('eqLabel').value.trim(),
                processor: document.getElementById('eqProcessor').value.trim(),
                ram: document.getElementById('eqRam').value.trim(),
                storage: document.getElementById('eqStorage').value.trim(),
                os: document.getElementById('eqOS').value.trim(),
                computerName: document.getElementById('eqComputerName').value.trim(),
                ip: document.getElementById('eqIP').value.trim(),
                mac: document.getElementById('eqMAC').value.trim(),
                powerSupply: document.getElementById('eqPowerSupply').value.trim(),
                monitor: document.getElementById('eqMonitor').value.trim(),
                mouse: document.getElementById('eqMouse').value.trim(),
                keyboard: document.getElementById('eqKeyboard').value.trim(),
                notes: document.getElementById('eqNotes').value.trim()
            };

            // Handle photo
            const photoInput = document.getElementById('eqPhoto');
            if (photoInput.files && photoInput.files[0]) {
                data.photo = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(photoInput.files[0]);
                });
            } else if (id) {
                const existing = await DB.get('equipments', id);
                data.photo = existing?.photo || '';
            }

            try {
                if (id) {
                    data.id = id;
                    const existing = await DB.get('equipments', id);
                    data.createdAt = existing.createdAt;
                    await DB.update('equipments', data);
                    await Logger.log('equipment', 'update', `Equipamento "${patrimony}" atualizado`);
                    showToast('Equipamento atualizado com sucesso!');
                } else {
                    await DB.add('equipments', data);
                    await Logger.log('equipment', 'create', `Equipamento "${patrimony}" cadastrado`);
                    showToast('Equipamento cadastrado com sucesso!');
                }
                closeModal();
                renderEquipments(document.getElementById('pageContainer'));
            } catch (e) {
                if (e.name === 'ConstraintError') {
                    showToast('Patrimônio já cadastrado!', 'error');
                } else {
                    showToast('Erro ao salvar: ' + e.message, 'error');
                }
            }

        async function deleteEquipment(id) {
            if (!confirm('Deseja realmente excluir este equipamento e todo seu histórico?')) return;
            const eq = await DB.get('equipments', id);
            // Delete related preventives
            const prevs = await DB.getByIndex('preventives', 'equipmentId', id);
            for (const p of prevs) await DB.delete('preventives', p.id);
            // Delete favorites
            try {
                const favs = await DB.getByIndex('favorites', 'equipmentId', id);
                for (const f of favs) await DB.delete('favorites', f.id);
            } catch (e) { }

            await DB.delete('equipments', id);
            await Logger.log('equipment', 'delete', `Equipamento "${eq.patrimony}" excluído`);
            showToast('Equipamento excluído com sucesso!');
            renderEquipments(document.getElementById('pageContainer'));
        }

        async function toggleFavorite(equipmentId) {
            const favorites = await DB.getAll('favorites');
            const existing = favorites.find(f => f.equipmentId === equipmentId);
            if (existing) {
                await DB.delete('favorites', existing.id);
                showToast('Removido dos favoritos', 'info');

        async function savePreventive() {
            const equipmentId = parseInt(document.getElementById('prevEquipment').value);
            const date = document.getElementById('prevDate').value;
            const technicianId = parseInt(document.getElementById('prevTechnician').value);

            if (!equipmentId || !date || !technicianId) {
                showToast('Preencha todos os campos obrigatórios', 'error');
                return;
            }

            // Collect checklist
            const checklist = [];
            document.querySelectorAll('#checklistContainer input[type="checkbox"]').forEach(cb => {
                checklist.push({ label: cb.dataset.label, checked: cb.checked });
            });

            // Collect photos
            let photoBefore = '';
            let photoAfter = '';
            const photoBeforeInput = document.getElementById('prevPhotoBefore');
            const photoAfterInput = document.getElementById('prevPhotoAfter');

            if (photoBeforeInput.files[0]) {
                photoBefore = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(photoBeforeInput.files[0]);
                });
            }
            if (photoAfterInput.files[0]) {
                photoAfter = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(photoAfterInput.files[0]);
                });
            }

            const data = {
                equipmentId,
                date,
                technicianId,
                preventiveType: document.getElementById('prevType').value,
                timeSpent: document.getElementById('prevTime').value,
                nextDate: document.getElementById('prevNextDate').value,
                checklist,
                observations: document.getElementById('prevObs').value.trim(),
                cost: document.getElementById('prevCost').value,
                replacedParts: document.getElementById('prevParts').value.trim(),
                photoBefore,
                photoAfter
            };

            try {
                await DB.add('preventives', data);
                const eq = await DB.get('equipments', equipmentId);
                await Logger.log('preventive', 'create', `Preventiva criada para "${eq.patrimony}"`);
                showToast('Preventiva registrada com sucesso!');
                closeModal();
                if (currentPage === 'preventives') renderPreventives(document.getElementById('pageContainer'));
                else if (currentPage === 'dashboard') renderDashboard(document.getElementById('pageContainer'));
            } catch (e) {
                showToast('Erro ao salvar preventiva: ' + e.message, 'error');
            }
        }

        // ============================================================
        // AGENDA / CALENDAR MODULE
        // ============================================================
        let calendarDate = new Date();

        async function renderAgenda(container) {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];

            // Get preventives for this month
            const preventives = await DB.getAll('preventives');
            const equipments = await DB.getAll('equipments');

            const monthPrevs = preventives.filter(p => {
                const nd = p.nextDate;
                if (!nd) return false;
                return nd.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`);
            });

            const donePrevs = preventives.filter(p => {
                return p.date && p.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`);
            });

            // Build calendar
            let calendarHtml = '';
            // Day headers
            dayNames.forEach(d => {
                calendarHtml += `<div class="text-center text-xs font-bold text-gray-500 dark:text-gray-400 py-2">${d}</div>`;
            });

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                calendarHtml += `<div class="calendar-day bg-gray-50/50 dark:bg-gray-800/30"></div>`;
            }

            // Day cells
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;

                const dayScheduled = monthPrevs.filter(p => p.nextDate === dateStr);
                const dayDone = donePrevs.filter(p => p.date === dateStr);
                const hasEvents = dayScheduled.length > 0 || dayDone.length > 0;

                calendarHtml += `<div class="calendar-day bg-white dark:bg-gray-800 ${isToday ? 'today' : ''} ${hasEvents ? 'has-events' : ''}">
                <div class="font-bold text-xs ${isToday ? 'text-blue-600' : ''}">${d}</div>
                ${dayDone.map(p => {
                    const eq = equipments.find(e => e.id === p.equipmentId);
                    return `<div class="calendar-event bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-300" title="Realizada: ${eq ? eq.patrimony : ''}">${eq ? eq.patrimony.substring(0, 8) : ''}</div>`;
                }).join('')}
                ${dayScheduled.map(p => {
                    const eq = equipments.find(e => e.id === p.equipmentId);
                    const isOverdue = dateStr < todayStr;
                    return `<div class="calendar-event ${isOverdue ? 'bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300' : 'bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300'}" title="Agendada: ${eq ? eq.patrimony : ''}">${eq ? eq.patrimony.substring(0, 8) : ''}</div>`;
                }).join('')}
            </div>`;
            }

            // Week/day summary
            const weekStart = new Date(today);
            weekStart.setDate(today.getDate() - today.getDay());
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            const weekStartStr = weekStart.toISOString().split('T')[0];
            const weekEndStr = weekEnd.toISOString().split('T')[0];

            const todayPrevs = preventives.filter(p => p.nextDate === todayStr);
            const weekPrevs = preventives.filter(p => p.nextDate >= weekStartStr && p.nextDate <= weekEndStr);
            const overduePrevs = preventives.filter(p => p.nextDate && p.nextDate < todayStr);

            container.innerHTML = `
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
                <!-- Calendar -->

        async function performSearch() {
            const term = (document.getElementById('searchMainInput')?.value || '').toLowerCase();

            const situation = document.getElementById('searchSituation')?.value || '';

            const equipments = await DB.getAll('equipments');
            const sectors = await DB.getAll('sectors');

            const results = equipments.filter(e => {
                const matchTerm = !term ||
                    (e.patrimony || '').toLowerCase().includes(term) ||
                    (e.responsibleUser || '').toLowerCase().includes(term) ||
                    (e.serialNumber || '').toLowerCase().includes(term) ||
                    (e.ip || '').toLowerCase().includes(term) ||
                    (e.computerName || '').toLowerCase().includes(term) ||
                    (e.manufacturer || '').toLowerCase().includes(term) ||
                    (e.model || '').toLowerCase().includes(term) ||
                    (e.mac || '').toLowerCase().includes(term);
                const matchType = !type || e.type === type;
                const matchSituation = !situation || e.situation === situation;
                return matchTerm && matchType && matchSituation;

        let lastReportData = [];

        async function generateReport() {
            const type = document.getElementById('reportType').value;
            const sectorFilter = document.getElementById('reportSector').value;
            const dateStart = document.getElementById('reportDateStart').value;
            const dateEnd = document.getElementById('reportDateEnd').value;

            const equipments = await DB.getAll('equipments');
            const sectors = await DB.getAll('sectors');
            const preventives = await DB.getAll('preventives');
            const technicians = await DB.getAll('technicians');
            const today = new Date().toISOString().split('T')[0];

            let filtered = [...equipments];

            // Apply filters
            if (sectorFilter) filtered = filtered.filter(e => e.sectorId === parseInt(sectorFilter));

            switch (type) {
                case 'notebooks': filtered = filtered.filter(e => e.type === 'Notebook'); break;
                case 'desktops': filtered = filtered.filter(e => e.type === 'Desktop'); break;
                case 'inMaintenance': filtered = filtered.filter(e => e.situation === 'Em manutenção'); break;
                case 'noPreventive':
                    filtered = filtered.filter(e => {
                        const eqPrevs = preventives.filter(p => p.equipmentId === e.id);
                        return eqPrevs.length === 0;
                    });
                    break;
                case 'overdue':
                    filtered = filtered.filter(e => {
                        if (e.situation === 'Baixado') return false;
                        const eqPrevs = preventives.filter(p => p.equipmentId === e.id);
                        if (eqPrevs.length === 0) return true;
                        const last = eqPrevs.sort((a, b) => b.date.localeCompare(a.date))[0];
                        return last.nextDate && last.nextDate < today;
                    });
                    break;
            }

            lastReportData = filtered.map(e => {
                const sector = sectors.find(s => s.id === e.sectorId);
                const eqPrevs = preventives.filter(p => p.equipmentId === e.id);
                const lastPrev = eqPrevs.sort((a, b) => b.date.localeCompare(a.date))[0];
                return {
                    Patrimônio: e.patrimony,
                    Tipo: e.type,
                    Fabricante: e.manufacturer,
                    Modelo: e.model,
                    Setor: sector ? sector.name : '-',
                    Usuário: e.responsibleUser,
                    Situação: e.situation,
                    'Última Preventiva': lastPrev ? formatDate(lastPrev.date) : 'Nunca',
                    'Próxima Preventiva': lastPrev?.nextDate ? formatDate(lastPrev.nextDate) : '-',
                    'Total Preventivas': eqPrevs.length
                };
            });

            const sitBadge = { 'Ativo': 'badge-active', 'Em manutenção': 'badge-maintenance', 'Reserva': 'badge-reserve', 'Baixado': 'badge-retired' };

            document.getElementById('reportResults').innerHTML = `
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden" id="reportTable">
                <div class="p-3 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
                    <span class="text-sm font-semibold text-gray-600">${lastReportData.length} registro(s)</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="data-table">
                        <thead>
                            <tr class="bg-gray-50 dark:bg-gray-700/50">
                                <th class="text-gray-500">Patrimônio</th>
                                <th class="text-gray-500">Tipo</th>
                                <th class="text-gray-500">Setor</th>
                                <th class="text-gray-500">Usuário</th>
                                <th class="text-gray-500">Situação</th>
                                <th class="text-gray-500">Última Prev.</th>
                                <th class="text-gray-500">Próxima Prev.</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${lastReportData.map(r => `<tr class="border-t border-gray-50 dark:border-gray-700/50">
                                <td class="font-bold">${r.Patrimônio}</td>
                                <td>${r.Tipo}</td>
                                <td>${r.Setor}</td>
                                <td>${r.Usuário}</td>
                                <td><span class="badge ${sitBadge[r.Situação] || 'badge-active'}">${r.Situação}</span></td>
                                <td>${r['Última Preventiva']}</td>
                                <td>${r['Próxima Preventiva']}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        }

        function exportReport(format) {
            if (lastReportData.length === 0) {
                showToast('Gere o relatório primeiro', 'warning');
                return;
            }

            switch (format) {
                case 'pdf': {
                    const element = document.getElementById('reportTable');
                    if (element) {
                        html2pdf().set({
                            margin: 10,
                            filename: `relatorio_preventech_${new Date().toISOString().split('T')[0]}.pdf`,
                            html2canvas: { scale: 2 },
                            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                        }).from(element).save();
                        showToast('PDF gerado!', 'success');
                    }
                    break;
                }
                case 'excel': {
                    const ws = XLSX.utils.json_to_sheet(lastReportData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Relatório');
                    XLSX.writeFile(wb, `relatorio_preventech_${new Date().toISOString().split('T')[0]}.xlsx`);
                    showToast('Excel gerado!', 'success');
                    break;
                }
                case 'csv': {
                    const headers = Object.keys(lastReportData[0]).join(';');
                    const rows = lastReportData.map(r => Object.values(r).join(';'));
                    const csvContent = '\ufeff' + headers + '\n' + rows.join('\n');
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `relatorio_preventech_${new Date().toISOString().split('T')[0]}.csv`;
                    link.click();
                    showToast('CSV gerado!', 'success');
                    break;
                }
            }
        }

        async function renderAlerts(container) {
            const equipments = await DB.getAll('equipments');
            const preventives = await DB.getAll('preventives');
            const sectors = await DB.getAll('sectors');
            const today = new Date().toISOString().split('T')[0];

            const alerts = [];

            for (const eq of equipments) {
                if (eq.situation === 'Baixado') continue;
                const sector = sectors.find(s => s.id === eq.sectorId);
                const eqPrevs = preventives.filter(p => p.equipmentId === eq.id);

                if (eqPrevs.length === 0) {
                    alerts.push({
                        type: 'danger',
                        icon: 'exclamation-circle',
                        message: `<strong>${eq.patrimony}</strong> nunca teve preventiva realizada`,
                        sector: sector?.name || '-',
                        equipmentId: eq.id
                    });
                    continue;
                }

                const lastPrev = eqPrevs.sort((a, b) => b.date.localeCompare(a.date))[0];
                const daysSince = daysBetween(lastPrev.date, today);

                if (daysSince >= 180) {
                    alerts.push({
                        type: 'danger',
                        icon: 'exclamation-triangle',
                        message: `<strong>${eq.patrimony}</strong> está há <strong>${daysSince} dias</strong> sem manutenção`,
                        sector: sector?.name || '-',
                        equipmentId: eq.id
                    });
                }

                if (lastPrev.nextDate) {
                    const daysTo = daysBetween(today, lastPrev.nextDate);
                    if (daysTo < 0) {
                        alerts.push({
                            type: 'danger',
                            icon: 'calendar-times',
                            message: `<strong>${eq.patrimony}</strong> preventiva vencida há <strong>${Math.abs(daysTo)} dias</strong>`,
                            sector: sector?.name || '-',
                            equipmentId: eq.id
                        });
                    } else if (daysTo <= 30) {
                        alerts.push({
                            type: 'warning',
                            icon: 'clock',
                            message: `<strong>${eq.patrimony}</strong> preventiva vence em <strong>${daysTo} dias</strong>`,
                            sector: sector?.name || '-',
                            equipmentId: eq.id
                        });
                    }
                }

                // Warranty alert
                if (eq.warranty) {
                    const wDays = daysBetween(today, eq.warranty);
                    if (wDays >= 0 && wDays <= 30) {
                        alerts.push({
                            type: 'warning',
                            icon: 'shield-alt',
                            message: `<strong>${eq.patrimony}</strong> garantia vence em <strong>${wDays} dias</strong>`,
                            sector: sector?.name || '-',
                            equipmentId: eq.id
                        });
                    }
                }
            }

            // Sort: danger first
            alerts.sort((a, b) => a.type === 'danger' ? -1 : 1);

            const alertColors = {
                danger: 'border-l-4 border-red-500 bg-red-50 dark:bg-red-900/20',
                warning: 'border-l-4 border-yellow-500 bg-yellow-50 dark:bg-yellow-900/20'
            };
            const iconColors = {
                danger: 'text-red-500',
                warning: 'text-yellow-500'
            };

            container.innerHTML = `
            <div class="flex items-center justify-between mb-4">
                <p class="text-sm text-gray-500">${alerts.length} alerta(s) ativo(s)</p>
            </div>
            
            ${alerts.length === 0 ? `
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-12 text-center">
                    <i class="fas fa-check-circle text-5xl text-green-500 mb-3"></i>
                    <h3 class="text-xl font-bold text-gray-700 dark:text-gray-300">Tudo em dia!</h3>
                    <p class="text-gray-500">Não há alertas pendentes.</p>
                </div>
            ` : `
                <div class="space-y-2">
                    ${alerts.map(a => `
                        <div class="${alertColors[a.type]} rounded-lg p-4 flex items-center justify-between cursor-pointer hover:shadow-md transition" onclick="openEquipmentDashboard(${a.equipmentId})">
                            <div class="flex items-center gap-3">
                                <i class="fas fa-${a.icon} ${iconColors[a.type]} text-lg"></i>
                                <div>
                                    <p class="text-sm">${a.message}</p>
                                    <p class="text-xs text-gray-500">Setor: ${a.sector}</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-gray-400"></i>
                        </div>
                    `).join('')}
                </div>
            `}
        `;
        }

        async function updateAlertBadge() {
            const badge = document.getElementById('alertBadge');
            if (!badge) return;

            try {
                const equipments = await DB.getAll('equipments');
                const preventives = await DB.getAll('preventives');
                const today = new Date().toISOString().split('T')[0];
                let count = 0;

                for (const eq of equipments) {
                    if (eq.situation === 'Baixado') continue;
                    const eqPrevs = preventives.filter(p => p.equipmentId === eq.id);
                    if (eqPrevs.length === 0) { count++; continue; }
                    const last = eqPrevs.sort((a, b) => b.date.localeCompare(a.date))[0];
                    if (last.nextDate && last.nextDate < today) count++;
                    else if (daysBetween(last.date, today) >= 180) count++;
                }

                badge.textContent = count;
                badge.classList.toggle('hidden', count === 0);
            } catch (e) { }
        }

                    <div class="w-16 h-16 bg-green-100 dark:bg-green-900 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-upload text-2xl text-green-600"></i>
                    </div>
                    <h3 class="font-bold text-lg mb-2">Importar Backup</h3>
                    <p class="text-sm text-gray-500 mb-4">Restaura dados de um arquivo JSON</p>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(this)">
                    <button onclick="document.getElementById('importFile').click()" class="w-full py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold text-sm">
                        <i class="fas fa-upload mr-2"></i>Importar
                    </button>
                </div>
                
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-red-100 dark:border-red-800 p-6 text-center">
                    <div class="w-16 h-16 bg-red-100 dark:bg-red-900 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-trash-alt text-2xl text-red-600"></i>
                    </div>
                    <h3 class="font-bold text-lg mb-2">Limpar Dados</h3>
                    <p class="text-sm text-gray-500 mb-4">Remove todos os dados do sistema</p>
                    <button onclick="clearAllData()" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold text-sm">
                        <i class="fas fa-trash mr-2"></i>Limpar Tudo
                    </button>
                </div>
            </div>
        `;
        }

        async function exportBackup() {
            try {
                const data = await DB.exportAll();
                data.exportDate = new Date().toISOString();
                data.version = DB.version;

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `preventech_backup_${new Date().toISOString().split('T')[0]}.json`;
                link.click();

                await Logger.log('system', 'backup', 'Backup exportado');
                showToast('Backup exportado com sucesso!', 'success');
            } catch (e) {
                showToast('Erro ao exportar: ' + e.message, 'error');
            }
        }

        async function importBackup(input) {
            if (!input.files[0]) return;
            if (!confirm('Isso irá substituir todos os dados atuais. Continuar?')) return;

            try {
                const text = await input.files[0].text();
                const data = JSON.parse(text);
                await DB.importAll(data);
                await Logger.log('system', 'restore', 'Backup importado');
                showToast('Backup importado com sucesso!', 'success');
                navigateTo('dashboard');
            } catch (e) {
                showToast('Erro ao importar: ' + e.message, 'error');
            }
        }

        async function clearAllData() {
            if (!confirm('ATENÇÃO: Todos os dados serão removidos permanentemente! Deseja continuar?')) return;
            if (!confirm('Tem certeza ABSOLUTA? Esta ação não pode ser desfeita!')) return;

            const storeNames = ['sectors', 'equipments', 'preventives', 'technicians', 'favorites'];
            for (const name of storeNames) {
                const tx = DB.db.transaction(name, 'readwrite');
                tx.objectStore(name).clear();
                await new Promise((resolve) => { tx.oncomplete = resolve; });
            }

            await Logger.log('system', 'clear', 'Todos os dados foram limpos');
            showToast('Todos os dados foram removidos!', 'warning');
            navigateTo('dashboard');
        }

        // ============================================================
        // SETTINGS MODULE
        // ============================================================
        async function renderSettings(container) {
            const settings = await DB.getAll('settings');
            const monthsSetting = settings.find(s => s.key === 'preventiveMonths');
            const months = monthsSetting ? monthsSetting.value : '6';

            container.innerHTML = `
            <div class="max-w-2xl">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 mb-4">
                    <h3 class="font-bold text-lg mb-4"><i class="fas fa-cog mr-2 text-gray-500"></i>Configurações Gerais</h3>
                    
                    <div class="form-group">
                        <label class="form-label">Intervalo entre preventivas (meses)</label>
                        <input type="number" id="settingMonths" class="form-input max-w-xs" value="${months}" min="1" max="24">
                        <p class="text-xs text-gray-500 mt-1">Define automaticamente a próxima preventiva</p>
                    </div>
                    
                    <button onclick="saveSettings()" class="mt-4 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm">
                        <i class="fas fa-save mr-2"></i>Salvar Configurações
                    </button>
                </div>
                
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
                    <h3 class="font-bold text-lg mb-4"><i class="fas fa-info-circle mr-2 text-blue-500"></i>Sobre o Sistema</h3>
                    <div class="text-sm text-gray-600 dark:text-gray-400 space-y-1">
                        <p><strong>PrevenTech</strong> - Sistema de Controle de Preventivas</p>
                        <p>Versão: 1.0.0</p>
                        <p>Armazenamento: IndexedDB (Local)</p>
                        <p>Desenvolvido com HTML, CSS, JavaScript e Tailwind CSS</p>
                    </div>
                </div>
            </div>
        `;
        }

        async function saveSettings() {
            const months = document.getElementById('settingMonths').value;
            try {
                await DB.update('settings', { key: 'preventiveMonths', value: months });
            } catch (e) {
                await DB.add('settings', { key: 'preventiveMonths', value: months });
            }
            await Logger.log('system', 'settings', `Intervalo de preventiva alterado para ${months} meses`);
            showToast('Configurações salvas!', 'success');
        }

        // ============================================================
        // LOGS MODULE
        // ============================================================
        async function renderLogs(container) {
            const logs = await DB.getAll('logs');
            const sorted = [...logs].sort((a, b) => b.timestamp.localeCompare(a.timestamp));

            const typeColors = {
                sector: 'text-amber-600 bg-amber-100',
                equipment: 'text-blue-600 bg-blue-100',
                preventive: 'text-green-600 bg-green-100',
                technician: 'text-purple-600 bg-purple-100',
                system: 'text-gray-600 bg-gray-100'
            };

            container.innerHTML = `
            <div class="flex items-center justify-between mb-4">
                <p class="text-sm text-gray-500">${sorted.length} registro(s)</p>
                <button onclick="clearLogs()" class="px-3 py-1.5 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg font-semibold">
                    <i class="fas fa-trash mr-1"></i>Limpar Logs
                </button>
            </div>
            
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                <div class="overflow-x-auto max-h-[70vh] overflow-y-auto">
                    <table class="data-table">
                        <thead class="sticky top-0 bg-gray-50 dark:bg-gray-700">
                            <tr>
                                <th class="text-gray-500">Data/Hora</th>
                                <th class="text-gray-500">Módulo</th>
                                <th class="text-gray-500">Ação</th>
                                <th class="text-gray-500">Detalhes</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sorted.length === 0 ? '<tr><td colspan="4" class="text-center text-gray-400 py-6">Nenhum log registrado</td></tr>' :
                    sorted.slice(0, 100).map(l => `<tr class="border-t border-gray-50 dark:border-gray-700/50">
                                <td class="text-xs whitespace-nowrap">${formatDateTime(l.timestamp)}</td>
                                <td><span class="px-2 py-0.5 rounded text-xs font-bold ${typeColors[l.type] || 'bg-gray-100 text-gray-600'}">${l.type}</span></td>
                                <td class="text-sm font-medium">${escapeHtml(l.action)}</td>
                                <td class="text-sm text-gray-600 dark:text-gray-400">${escapeHtml(l.details)}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        }

        async function clearLogs() {
            if (!confirm('Limpar todos os logs?')) return;
            const tx = DB.db.transaction('logs', 'readwrite');
            tx.objectStore('logs').clear();
            await new Promise(r => tx.oncomplete = r);
            showToast('Logs limpos!', 'info');
            renderLogs(document.getElementById('pageContainer'));
        }

        // ============================================================
        // UTILITY: TABLE SORT, FILTER, MODAL
        // ============================================================
        function closeModal() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        function filterRows(input, rowClass) {
            const term = input.value.toLowerCase();
            document.querySelectorAll(rowClass).forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
            });
        }

        let sortDirections = {};
        function sortTable(tableId, colIndex) {
            const table = document.getElementById(tableId);
            if (!table) return;
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));

            const key = `${tableId}_${colIndex}`;
            sortDirections[key] = !sortDirections[key];
            const ascending = sortDirections[key];

            rows.sort((a, b) => {
                const aText = a.cells[colIndex]?.textContent.trim().toLowerCase() || '';
                const bText = b.cells[colIndex]?.textContent.trim().toLowerCase() || '';
                return ascending ? aText.localeCompare(bText) : bText.localeCompare(aText);
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        async function init() {
            try {
                await DB.init();
                loadTheme();
                navigateTo('dashboard');

                // Initialize default settings if not exists
                try {
                    const settings = await DB.getAll('settings');
                    if (!settings.find(s => s.key === 'preventiveMonths')) {
                        await DB.add('settings', { key: 'preventiveMonths', value: '6' });
                    }
                } catch (e) { }

                console.log('PrevenTech initialized successfully');
            } catch (e) {
                console.error('Init error:', e);
                document.getElementById('pageContainer').innerHTML = `
                <div class="text-center py-12">
                    <i class="fas fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
                    <h2 class="text-xl font-bold mb-2">Erro ao inicializar</h2>
                    <p class="text-gray-500">${e.message}</p>
                    <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg">Recarregar</button>
                </div>
            `;
            }
        }

        // Start the application
        init();
    </script>
</body>

</html>
